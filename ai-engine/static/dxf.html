<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DXF Vector Reconstruction Tester</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .upload-section { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; border: 2px dashed #ccc; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
        .upload-section.dragover { border-color: #0066cc; background: #e6f2ff; }
        input[type="file"] { display: none; }
        .btn { padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #0052a3; }
        .loader { display: none; border: 4px solid #f3f3f3; border-top: 4px solid #0066cc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .results { display: none; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; justify-content: center; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 6px; text-align: center; min-width: 120px; border: 1px solid #eee; }
        .stat-card h3 { margin: 0; color: #666; font-size: 14px; }
        .stat-card p { margin: 5px 0 0; font-size: 24px; font-weight: bold; color: #0066cc; }
        .svg-container { width: 100%; height: 70vh; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; background: #222; }
        .svg-container svg { width: 100%; height: 100%; }
        .error { color: #dc3545; text-align: center; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>DXF Vector Reconstruction Tester</h1>
    
    <div class="upload-section" id="drop-zone">
        <p>Drag and drop your .dxf file here</p>
        <p>or</p>
        <label class="btn">
            Browse DXF File
            <input type="file" id="file-input" accept=".dxf">
        </label>
        <div id="file-name" style="margin-top: 10px; color: #666; font-weight: bold;"></div>
        <button class="btn" id="upload-btn" style="display: none; background: #28a745;">Process DXF</button>
    </div>

    <div class="loader" id="loader"></div>
    <div class="error" id="error-msg"></div>

    <div class="results" id="results">
        <div class="stats" id="stats-container">
            <!-- Stats inserted here -->
        </div>
        <h3 style="text-align: center;">Reconstructed Vector Geometry (SVG)</h3>
        <p style="text-align: center; color: #666; font-size: 14px;">Hint: You can right-click and save the SVG.</p>
        <div class="svg-container" id="svg-container"></div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileNameDisplay = document.getElementById('file-name');
    const uploadBtn = document.getElementById('upload-btn');
    const loader = document.getElementById('loader');
    const results = document.getElementById('results');
    const errorMsg = document.getElementById('error-msg');
    const svgContainer = document.getElementById('svg-container');
    const statsContainer = document.getElementById('stats-container');

    let selectedFile = null;

    fileInput.addEventListener('change', (e) => {
        if(e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            updateFileDisplay();
        }
    });

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if(e.dataTransfer.files.length > 0) {
            selectedFile = e.dataTransfer.files[0];
            updateFileDisplay();
        }
    });

    function updateFileDisplay() {
        if(selectedFile) {
            if(!selectedFile.name.toLowerCase().endsWith('.dxf')) {
                errorMsg.textContent = 'Please select a valid .dxf file.';
                errorMsg.style.display = 'block';
                uploadBtn.style.display = 'none';
                return;
            }
            errorMsg.style.display = 'none';
            fileNameDisplay.textContent = `Selected: ${selectedFile.name}`;
            uploadBtn.style.display = 'block';
        }
    }

    uploadBtn.addEventListener('click', async () => {
        if(!selectedFile) return;
        
        const formData = new FormData();
        formData.append('file', selectedFile);
        
        loader.style.display = 'block';
        results.style.display = 'none';
        errorMsg.style.display = 'none';
        
        try {
            const response = await fetch('/api/process_dxf', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if(data.success) {
                // Populate SVG
                svgContainer.innerHTML = data.svg_content;
                
                // Populate stats
                const stats = data.stats;
                statsContainer.innerHTML = `
                    <div class="stat-card"><h3>Layers</h3><p>${stats.layers}</p></div>
                    <div class="stat-card"><h3>Block Defs</h3><p>${stats.blocks}</p></div>
                    <div class="stat-card"><h3>Entities</h3><p>${stats.entities}</p></div>
                    <div class="stat-card"><h3>Dimensions</h3><p>${stats.dimensions}</p></div>
                `;
                
                results.style.display = 'block';
            } else {
                throw new Error(data.error || 'Unknown error occurred.');
            }
        } catch (err) {
            errorMsg.textContent = `Error: ${err.message}`;
            errorMsg.style.display = 'block';
        } finally {
            loader.style.display = 'none';
        }
    });
</script>

</body>
</html>
